<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pomodoro - Setting</title>
  <link rel="stylesheet" href="settings.css" />
</head>
<body>
  <main class="container">
    <!-- 설정 제목 -->
    <h3 class="title">Setting</h3>

    <!-- 타이머 시간 설정 입력 -->
    <div class="field">
      <label class="field-label" for="timeInput">타이머 시간 (분)</label>
      <input
        type="number"
        id="timeInput"
        class="time-input"
        min="1"
        max="60"
        value="25"
      />
    </div>

    <!-- 유효성 안내 메시지 -->
    <p class="error-message" id="errorMessage"></p>

    <!-- 버튼 영역 -->
    <div class="button-group">
      <!-- 저장 버튼 -->
      <button type="button" class="btn btn-save" id="saveBtn">저장</button>
      <!-- 메인 페이지로 돌아가는 버튼 -->
      <a href="index.html" class="btn btn-back">메인으로 돌아가기</a>
    </div>
  </main>

  <script src="settings.js"></script>
</body>
</html>
