<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pomodoro</title>
  <link rel="stylesheet" href="index.css" />
</head>
<body>
  <main class="container">
    <h1 class="title">Pomodoro</h1>

    <!-- 현재 남은 시간 표시 -->
    <div class="timer" id="timer">25:00</div>

    <!-- 시작 / 정지 / 초기화 버튼 -->
    <div class="controls">
      <button type="button" class="btn btn-start" id="startBtn">시작</button>
      <button type="button" class="btn btn-stop" id="stopBtn">정지</button>
      <button type="button" class="btn btn-reset" id="resetBtn">초기화</button>
    </div>

    <!-- 설정 버튼 (설정 페이지로 이동) -->
    <a href="settings.html" class="btn btn-settings" id="settingsBtn">설정</a>
  </main>

  <script src="script.js"></script>
</body>
</html>
